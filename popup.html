<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; padding: 15px; font-family: Arial, sans-serif; text-align: center; }
    button { padding: 12px 15px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; color: white;}
    #toggleBtn { background-color: #ef4444; } /* Rouge par défaut (OFF) */
    #toggleBtn.active { background-color: #22c55e; } /* Vert si (ON) */
    #downloadBtn { background-color: #3b82f6; }
  </style>
</head>
<body>
  <h2>Étude de Navigation</h2>
  <button id="toggleBtn">🔴 COLLECTE OFF</button>
  <button id="downloadBtn"> Télécharger les données</button>
  <script src="popup.js"></script>
</body>
</html>
