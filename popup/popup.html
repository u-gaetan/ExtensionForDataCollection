<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      text-align: center;
    }
    h2 {
      margin: 0 0 5px 0;
      font-size: 15px;
    }
    .subtitle {
      font-size: 11px;
      color: #888;
      margin-bottom: 15px;
    }
    .participant-badge {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: #60a5fa;
      margin-bottom: 15px;
      display: inline-block;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-bottom: 6px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #toggleBtn { background-color: #3b82f6; }
    #statusMsg {
      font-size: 11px;
      margin-top: 8px;
      min-height: 16px;
      line-height: 1.4;
    }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
    .info { color: #60a5fa; }
    .note {
      font-size: 10px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>🔬 Étude Navigation Web</h2>
  <p class="subtitle">Université Laval — Recherche CÉRUL</p>

  <div class="participant-badge" id="participantBadge">ID : ...</div>

  <button id="toggleBtn">▶️ DÉMARRER L'ÉTUDE</button>

  <div id="statusMsg"></div>

  <p class="note">
    Les données sont envoyées automatiquement toutes les 3 minutes
    et à la fin de la session lorsque vous cliquez sur « Arrêter l'étude ».
  </p>

  <script src="popup.js"></script>
</body>
</html>
